<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ANI AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand">
        <div class="logo">A</div>

        <div>
          <h1>ANI AI</h1>
          <span>Powered by Cerebras</span>
        </div>
      </div>

      <button class="new-chat" id="newChat">
        ＋ New Chat
      </button>

      <div class="side-section">
        <p>ANI AI</p>

        <button class="side-item" id="clearChat">
          🗑 Clear conversation
        </button>
      </div>

      <div class="sidebar-bottom">
        <div class="status">
          <span class="status-dot"></span>
          AI Online
        </div>

        <div class="developer">
          Made by <b>ANIRUDDHA</b>
        </div>
      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <header class="topbar">

        <div class="mobile-brand">
          <div class="mini-logo">A</div>
          <b>ANI AI</b>
        </div>

        <div class="model">
          <span class="green-dot"></span>
          Cerebras AI
        </div>

      </header>


      <!-- CHAT -->
      <section class="chat" id="chat">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            A
          </div>

          <h2>Welcome to ANI AI</h2>

          <p>
            Your fast AI assistant powered by Cerebras.
          </p>

          <div class="suggestions">

            <button data-prompt="Explain artificial intelligence in simple words">
              🤖 Explain AI
            </button>

            <button data-prompt="Give me a cool website idea">
              💡 Website idea
            </button>

            <button data-prompt="Write a Python program for a beginner">
              💻 Write code
            </button>

            <button data-prompt="Tell me an interesting fact">
              🌎 Interesting fact
            </button>

          </div>

        </div>

      </section>


      <!-- INPUT -->
      <div class="input-area">

        <div class="input-box">

          <textarea
            id="messageInput"
            placeholder="Message ANI AI..."
            rows="1"
          ></textarea>

          <button id="sendButton" class="send">
            ➤
          </button>

        </div>

        <div class="disclaimer">
          ANI AI can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>


  <script src="script.js"></script>

</body>
</html>
